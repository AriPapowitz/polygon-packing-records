[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polypack"
version = "1.0.0"
description = "Certified GPU search, verification, and analysis of regular-polygon packings (the toolkit behind a 2026 record campaign on Erich Friedman's Packing Center)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Aristotle Papowitz", email = "aripapowitz@icloud.com" }]
keywords = [
    "packing",
    "computational-geometry",
    "global-optimization",
    "jax",
    "gpu",
    "experimental-mathematics",
    "certified-computation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.59",
    "mpmath>=1.3",
    "matplotlib>=3.8",
    "pillow>=10",
    "jax>=0.4.30",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.30"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/AriPapowitz/polygon-packing-records"
Issues = "https://github.com/AriPapowitz/polygon-packing-records/issues"
"Packing Center" = "https://erich-friedman.github.io/packing/"

[project.scripts]
polypack-search = "polypack.packer_bh:main"
polypack-validate = "polypack.validate_packing:main"
polypack-reconstruct = "polypack.reconstruct_gif:main"
polypack-drop-one = "polypack.drop_one:main"
polypack-exact = "polypack.exact_solve:main"
polypack-lattice = "polypack.build_lattice:main"
polypack-scan-removals = "polypack.scan_removals:main"
polypack-render = "polypack.render_packing:main"
polypack-render-webready = "polypack.render_webready:main"
polypack-scrape = "polypack.scrape_tables:main"

[tool.setuptools]
packages = ["polypack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running integration tests (engine smoke search, image round-trip)",
]
